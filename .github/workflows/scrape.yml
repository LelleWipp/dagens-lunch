name: Hämta dagens menyer

on:
  schedule:
    # Weekdays 08:47 UTC = 09:47 Swedish winter time / 10:47 summer time.
    # Off the full hour on purpose: GitHub delays scheduled runs at :00.
    - cron: "47 8 * * 1-5"
  workflow_dispatch:
  push: # TEMPORARY: real runs on the PR branch before merge; removed before merging
    branches: [feat/scraper]
    paths: [".github/workflows/scrape.yml"]

permissions:
  contents: write # commit menus.json
  pages: write # ask GitHub Pages to rebuild after the commit

concurrency:
  group: scrape-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install .
      - name: Fetch menus
        run: python -m scraper.build
      - name: Commit menus.json
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data
          if git diff --cached --quiet; then
            echo "No menu changes."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          day=$(python -c "import json; print(json.load(open('docs/data/menus.json'))['date'])")
          git commit -m "data: menyer $day"
          git push
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Rebuild GitHub Pages
        # Pushes made with GITHUB_TOKEN do not always trigger a Pages build, so request one.
        if: steps.commit.outputs.changed == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || echo "::warning::Could not request a Pages build"
